{% set name = "plumpy" %}
{% set version = "0.26.1" %}
{% set sha256 = "d4f301eed5c67afe0e49af31b27a8c44b6b35c49d5b4b4790992b580ce245424" %}
# Set package metainfo
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core >=3.4,<4
  run:
    - python >={{ python_min }}
    - pyyaml ~=6.0
    - greenback ~=1.0
    - greenlet >=3.2.4
    - kiwipy[rmq] ~=0.9.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - plumpy
    - plumpy.base

about:
  home: https://github.com/aiidateam/plumpy
  license: MIT AND GPL-3.0-only
  license_file: LICENSE.txt
  summary: A python workflow library that supports multithreading, and RabbitMQ as a message broker for starting/stopping/monitoring tasks.
  dev_url: https://github.com/aiidateam/plumpy

extra:
  recipe-maintainers:
    - khsrali
    - giovannipizzi
    - agoscinski
    - GeigerJ2
    - edan-bainglass
    - danielhollas
